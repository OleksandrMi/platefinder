<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Поиск номеров</title>
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Номера">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Камера на весь экран, панели снизу; единый тёмный стиль, как в Android-версии */
:root {
  --bg: #0a0d12;
  --surface: #141922;
  --surface-hi: #1d2430;
  --outline: #2a3342;
  --text: #f2f5fa;
  --dim: #8a94a6;
  --accent: #3d8bff;
  --red: #ff3b30;
  --green: #30d158;
  --eu-blue: #003399;
  --eu-yellow: #ffcc00;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--text); }
[hidden] { display: none !important; }

/* ---------- камера ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; background: #000; touch-action: none; }
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.top { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--st) + 10px) max(16px, var(--sr)) 18px max(16px, var(--sl));
  background: linear-gradient(rgba(0,0,0,.75), transparent); z-index: 5; }
.top-row { display: flex; align-items: center; gap: 12px; }
.top h1 { margin: 0; font-size: 18px; font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.82); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.2s ease-in-out infinite alternate; }
.dot.rec { background: var(--red); }
.dot.wait { background: var(--eu-yellow); }
@keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); }
.round svg, .bar-btn svg { width: 22px; height: 22px; }

.banner { margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #fff;
  animation: drop .25s ease-out; }
@keyframes drop { from { transform: translateY(-12px); opacity: 0 } to { transform: none; opacity: 1 } }
.banner .t { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.banner .n { font-size: 13px; opacity: .9; }
.banner > div { flex: 1; min-width: 0; }

.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 24px max(10px, var(--sr)) calc(var(--sb) + 12px) max(10px, var(--sl)); background: linear-gradient(transparent, rgba(0,0,0,.85)); }
.toast { display: flex; align-items: center; gap: 4px; max-width: calc(100% - 32px); padding: 4px 6px 4px 18px; border-radius: 22px;
  background: rgba(32,40,51,.92); font-size: 14px; animation: drop .2s ease-out; }
.toast span { padding: 8px 12px 8px 0; }
.toast button { color: var(--eu-yellow); font-weight: 600; padding: 8px 12px; }
.zoom { display: flex; gap: 4px; padding: 4px; border-radius: 20px; background: rgba(0,0,0,.45); }
.zoom button { width: 38px; height: 38px; border-radius: 50%; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.zoom button.on { background: rgba(255,255,255,.22); color: var(--eu-yellow); }
.controls { width: 100%; display: flex; justify-content: space-evenly; align-items: center; }
.bar-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,.88); min-width: 56px; }
.bar-btn .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); }
.bar-btn.on .ic { background: var(--eu-yellow); color: #000; }
.hint { font-size: 11px; color: rgba(255,255,255,.6); }

.shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; padding: 7px; touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .12s; }
.shutter i { display: block; width: 100%; height: 100%; border-radius: 40px; background: #fff; transition: all .2s; }
.shutter.down { transform: scale(.9); }
.shutter.rec { border-color: var(--red); }
.shutter.rec i { background: var(--red); border-radius: 8px; transform: scale(.45); }

/* ---------- старт ---------- */
#start { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: calc(var(--st) + 24px) max(24px, var(--sr)) calc(var(--sb) + 24px) max(24px, var(--sl)); background: var(--bg); text-align: center; }
#start h2 { margin: 0; font-size: 24px; }
#start p { margin: 0; color: var(--dim); max-width: 34ch; }
.primary { background: var(--accent); color: #fff; padding: 14px 26px; border-radius: 14px; font-weight: 600; font-size: 16px; }
.progress { width: 220px; height: 4px; border-radius: 2px; background: var(--surface-hi); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.small { font-size: 12px; color: var(--dim); }

/* ---------- панели ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: calc(var(--st) + 8px) max(12px, var(--sr)) 8px max(8px, var(--sl)); }
.sheet-head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 600; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--surface-hi); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 max(16px, var(--sr)) calc(var(--sb) + 96px) max(16px, var(--sl)); }
.tabs { display: flex; padding: 0 max(16px, var(--sr)) 0 max(16px, var(--sl)); border-bottom: 1px solid var(--outline); }
.tabs button { flex: 1; padding: 12px 0; color: var(--dim); font-weight: 500; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
.search { position: relative; margin: 12px 0 8px; }
.search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 14px; border: 1px solid var(--outline); background: var(--surface); }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--outline); color: var(--dim); font-size: 13px; }
.chip.on { background: var(--surface-hi); color: var(--text); border-color: transparent; }
.chip .d { width: 8px; height: 8px; border-radius: 50%; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; overflow: hidden; min-height: 64px; }
.row .stripe { align-self: stretch; width: 5px; flex: none; }
.row .main { flex: 1; min-width: 0; padding: 10px 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.row .meta { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.toggle { display: flex; gap: 4px; padding: 4px; border-radius: 20px; background: var(--surface-hi); }
.toggle i { width: 22px; height: 22px; border-radius: 50%; opacity: .25; }
.toggle i.on { opacity: 1; box-shadow: inset 0 0 0 2px rgba(255,255,255,.85); }
.empty { padding: 48px 16px; text-align: center; color: var(--dim); }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 8px; }
.fab { position: fixed; right: max(16px, var(--sr)); bottom: calc(var(--sb) + 16px); z-index: 21; display: flex; gap: 8px; }
.fab button { padding: 14px 18px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.fab button.sec { background: var(--surface-hi); }

/* табличка номера */
.plate { display: inline-flex; align-items: stretch; height: 32px; border-radius: 6px; overflow: hidden; background: #fff; border: 1.5px solid #222; }
.plate .eu { width: 16px; background: var(--eu-blue); color: #fff; font-size: 8px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; }
.plate .num { color: #111; font: 700 16px/30px var(--mono); letter-spacing: 1px; padding: 0 8px; white-space: nowrap; }
.plate.lg { height: 44px; }
.plate.lg .eu { width: 22px; font-size: 10px; }
.plate.lg .num { font-size: 22px; line-height: 42px; padding: 0 12px; }

/* повяты */
.group { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 10px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.pw { display: flex; align-items: center; gap: 14px; padding: 8px 0; width: 100%; text-align: left; }
.pw .code { width: 58px; flex: none; text-align: center; padding: 6px 0; border-radius: 8px; background: var(--surface-hi); font: 700 15px var(--mono); }
.pw .nm { flex: 1; min-width: 0; }
.pw .nm small { display: block; color: var(--dim); font-size: 11px; }
.active-codes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.active-codes button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-radius: 16px; font: 700 13px var(--mono); border: 1px solid; }

/* журнал */
.card { background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; align-items: center; gap: 12px; }
.card-head .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.card-head .ic svg { width: 20px; height: 20px; }
.card-head .tt { flex: 1; min-width: 0; }
.card-head .tt b { display: block; font-weight: 600; }
.card-head .tt span { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.plates { display: flex; flex-wrap: wrap; gap: 6px; }
.coords { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.coords span { flex: 1; min-width: 0; }
.act { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px; background: var(--surface-hi); color: var(--text); font-size: 12px; text-decoration: none; }
.act svg { width: 15px; height: 15px; color: var(--accent); }
.note { font-size: 12px; color: var(--dim); margin: 2px 0 10px; }

/* диалоги */
.dialog-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0 } }
.dialog { width: 100%; max-width: 520px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px max(20px, var(--sr)) calc(var(--sb) + 20px) max(20px, var(--sl));
  display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; max-height: 90%; overflow-y: auto; }
.dialog h3 { margin: 0; font-size: 18px; }
.dialog label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
.dialog input[type=text], .dialog textarea { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--outline); background: var(--bg); color: var(--text); }
.dialog input.big { font: 700 22px var(--mono); letter-spacing: 1px; text-transform: uppercase; }
.dialog textarea { min-height: 160px; font-family: var(--mono); font-size: 14px; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.dialog .btns button { padding: 12px 18px; border-radius: 12px; font-weight: 600; }
.dialog .btns .ok { background: var(--accent); color: #fff; }
.dialog .btns .ok:disabled { opacity: .4; }
.dialog .btns .danger { color: var(--red); }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface-hi); border: 2px solid transparent; }
.seg button i { width: 14px; height: 14px; border-radius: 50%; }
.palette { display: flex; flex-wrap: wrap; gap: 12px; }
.palette button { width: 48px; height: 48px; border-radius: 50%; border: 3px solid transparent; }
.palette button.on { border-color: #fff; }
.set { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--outline); width: 100%; text-align: left; }
.set div { flex: 1; min-width: 0; }
.set small { display: block; color: var(--dim); font-size: 12px; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--outline); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(20px); }
.info { background: var(--surface); border-radius: 14px; padding: 14px; font-size: 13px; color: var(--dim); margin-top: 16px; }
.info b { color: var(--text); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<header class="top">
  <div class="top-row">
    <div style="flex:1;min-width:0">
      <h1>Поиск номеров</h1>
      <div class="status"><i class="dot wait" id="dot"></i><span id="status">Загрузка…</span></div>
    </div>
    <button class="round" id="btnSettings" aria-label="Настройки"></button>
  </div>
  <div id="banner" hidden></div>
</header>

<footer class="bottom">
  <div id="toast" hidden></div>
  <div class="zoom" id="zoom"></div>
  <div class="controls">
    <button class="bar-btn" id="btnList"><span class="ic"></span>Список</button>
    <button class="bar-btn" id="btnJournal"><span class="ic"></span>Журнал</button>
    <button class="shutter" id="shutter" aria-label="Фото, удерживайте для видео"><i></i></button>
    <button class="bar-btn" id="btnPoint"><span class="ic"></span>Точка GPS</button>
    <button class="bar-btn" id="btnTorch"><span class="ic"></span>Фонарь</button>
  </div>
  <div class="hint" id="hint">Нажмите — фото · удерживайте — видео</div>
</footer>

<section id="start">
  <div class="plate lg"><span class="eu">PL</span><span class="num">WA 12345</span></div>
  <h2>Поиск номеров</h2>
  <p>Камера в реальном времени находит польские номера и подсвечивает номера из вашего списка. Всё работает на телефоне, список никуда не отправляется.</p>
  <button class="primary" id="btnStart">Включить камеру</button>
  <div class="progress" id="progress" hidden><i></i></div>
  <div class="small" id="startNote">При первом запуске загружается модель распознавания (~3 МБ)</div>
</section>

<div id="sheets"></div>
<div id="dialogs"></div>
<input type="file" id="fileInput" accept=".txt,.csv,text/plain" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
